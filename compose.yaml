# Base Compose model: the shared data plane plus the production project name.
#
# Environment overlays:
#   compose.override.yaml  dev only  — loaded automatically by `docker compose up`
#   compose.prod.yaml      prod only — loaded only by deploy/compose-prod.sh
#
# `name` pins the Compose project name. Without it the project is named after
# the directory that holds the first Compose file (`app` on /srv/web-lair/app,
# `web-lair` locally), so moving the checkout would rename every container and
# volume.

name: web-lair

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    # pinned: uuidv7() defaults require PostgreSQL 18 (ledger §9.6)
    image: postgres:18
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
    logging: *default-logging

  rustfs:
    # pinned: RustFS 1.0.0 (GA 2026-09-16, ledger §21) — S3-compatible object storage.
    image: rustfs/rustfs:1.0.0
    security_opt:
      - 'no-new-privileges:true'
    restart: always
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]
    logging: *default-logging

  valkey:
    # pinned: Valkey 9.1.2 (2026-09-01, ledger §21) — fail-open cache layer
    # (embed-meta + rate-limit counters). No persistence on purpose: a restart may
    # reset counters — acceptable for a fail-open cache.
    image: valkey/valkey:9.1.2
    restart: always
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
    logging: *default-logging

networks:
  # Data services have no egress; only `app` (compose.prod.yaml) bridges inward
  # and outward. Dev adds `devhost` in compose.override.yaml so host-side
  # `pnpm dev` can reach the loopback port bindings.
  internal:
    internal: true

volumes:
  pgdata:
  rustfsdata:
