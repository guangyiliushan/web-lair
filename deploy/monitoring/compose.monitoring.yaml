# Production overlay: Gatus (the in-box monitor), loaded only by
# deploy/compose-prod.sh as the third -f file; compose.prod.yaml never includes
# it, so dev stacks and image builds never pull it.
#
# No depends_on: monitoring must not fail to start because its target is
# unhealthy. The UI binds 127.0.0.1 only (no auth; tailnet/SSH tunnel).
# `edge` is the outbound path (Bark, RDAP/WHOIS, DNS); `internal` links
# app/db/rustfs directly.
#
# The config directory comes from render-config.sh (compose-prod.sh runs it
# only before up/create); rules: deploy/monitoring/README.md "1. 文件" and
# "3. 部署".
#
# YAML anchors do not cross files: x-logging is copied from compose.prod.yaml
# and must be kept in sync by hand.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  gatus:
    # pinned: Gatus v5.38.0 (2026-10-28) — the config format matching the README table.
    image: ghcr.io/twin/gatus:v5.38.0
    restart: always
    security_opt:
      - 'no-new-privileges:true'
    # The image is scratch-based and runs a single static binary: it needs no
    # writable root filesystem and no capability. storage is memory and the
    # config is mounted :ro, so read_only costs nothing.
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    # No healthcheck: the scratch image has no curl/wget/sh, so Docker cannot
    # probe from inside the container. restart: always covers a live process;
    # a dead Gatus is only found by the box-external healthchecks deadman
    # (HC_DEADMAN_URL, see README §7).
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: ${GATUS_LOG_LEVEL:-INFO}
      # Monitor targets (all overridable by env; production defaults are compose service names)
      MONITOR_APP_ADDR: ${MONITOR_APP_ADDR:-app:3000}
      MONITOR_PG_ADDR: ${MONITOR_PG_ADDR:-db:5432}
      MONITOR_RUSTFS_ADDR: ${MONITOR_RUSTFS_ADDR:-rustfs:9000}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-30s}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-3}
      MONITOR_SUCCESS_THRESHOLD: ${MONITOR_SUCCESS_THRESHOLD:-2}
      # Optional feature switches: empty = the matching fragment is not
      # rendered (log only / checks skipped)
      BARK_URL: ${BARK_URL:-}
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      DRAIN_HEARTBEAT_TOKEN: ${DRAIN_HEARTBEAT_TOKEN:-}
      READY_TOKEN: ${READY_TOKEN:-}
    volumes:
      - ./deploy/monitoring/conf.d:/config:ro
    networks: [internal, edge]
    logging: *default-logging
