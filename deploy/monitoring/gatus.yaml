# Gatus — in-box monitoring (the single source of truth for config-as-code).
#
# Always loaded; three optional monitors that cannot be expressed as an empty
# value are appended by render-config.sh as sibling fragments:
#   zz-domain.yaml     only when SITE_DOMAIN is set (TLS certificate + domain
#                      expiry)
#   zz-drain.yaml      only when DRAIN_HEARTBEAT_TOKEN is set (drain heartbeat
#                      external endpoint)
#   zz-app-ready.yaml  only when READY_TOKEN is set (/api/ready probe)
# An empty value would stay permanently red (or panic Gatus), so it is
# expressed by whether the fragment renders at all; an empty alerting.custom
# url only Warns and skips the provider, so Bark needs no gate and always
# lives here — the render gate cannot diverge from the container env. Why
# only these three: deploy/monitoring/README.md "1. 文件".
#
# Gatus merges every *.yaml in GATUS_CONFIG_PATH and polls each file's mtime
# every 30s, so rendering must be content-idempotent: any write hot-reloads
# storage and wipes the history plus already-fired alerts (duplicate alerts,
# no RESOLVED). Deleting a fragment does not trigger a reload, so the renderer
# touches this file when it revokes one.
#
# Gatus runs os.ExpandEnv over the whole YAML: a missing variable expands to
# an empty string and fails URL/token validation (panic, exit 2), so MONITOR_*
# must always hold a value — the error path verify-config.sh covers.
#
# With BARK_URL unset the provider is ignored (one startup log line
# "Ignoring provider=custom"); endpoints keep running, they just never send
# (deploy/monitoring/README.md "4. 告警：Bark").

storage:
  # History does not matter (in-box observation + alerts); memory avoids
  # adding another volume or database just for monitoring.
  type: memory

# Do not add `skip-invalid-config-update: true`. Gatus v5.38 hot-reloads via
# stop() → load(); on failure that flag only logs and continues, **never
# restarting** — the container still looks running while watchdog and HTTP
# (incl. /health) are dead: a silent zombie. Without it, bad config panics →
# exit 2 → a visible restart: always (verify-config.sh's negative cases cover it).

# Bark alerts (custom provider): the payload carries only title/body/group,
# never URL/stack/credentials. An empty url only logs one Warn and skips the
# provider, so it needs no fragment gate.
alerting:
  custom:
    url: '${BARK_URL}'
    method: POST
    headers:
      Content-Type: application/json
    body: |
      {"title":"[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_GROUP]","body":"[ENDPOINT_NAME] — [ALERT_DESCRIPTION]","group":"web-lair"}
    client:
      timeout: 10s

# Frontend title (within 1024 chars), to line up with the Caddy site name.
ui:
  title: web-lair status

endpoints:
  # ── Site HTTP: direct to app:3000 on the internal network, no Caddy/DNS ───
  # Direct because Caddy/certificate/DNS problems are covered by the HTTPS
  # check in zz-domain.yaml; here we only ask whether the app process still
  # answers routes correctly.
  - name: site-home
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 3000'
    alerts:
      - type: custom
        description: '首页不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: site-posts-zh
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/zh-cn/posts'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: custom
        description: '文章列表不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: site-sitemap
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/sitemap.xml'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: custom
        description: 'sitemap 不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # Unauthenticated /admin must 303 to the login page (src/lib/server/authz.ts
  # redirectToLogin). ignore-redirect must be true: following redirects by
  # default would see the login page's 200 and mask a broken guard.
  - name: site-admin-guard
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/admin'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
      ignore-redirect: true
    conditions:
      - '[STATUS] == 303'
    alerts:
      - type: custom
        description: '/admin 守卫未按 303 跳转'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # ── TCP: data-plane port liveness (accept only, not usability) ────────────
  - name: pg-tcp
    group: web-lair
    url: 'tcp://${MONITOR_PG_ADDR}'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[CONNECTED] == true'
    alerts:
      - type: custom
        description: 'PostgreSQL 端口不可达'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: rustfs-tcp
    group: web-lair
    url: 'tcp://${MONITOR_RUSTFS_ADDR}'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[CONNECTED] == true'
    alerts:
      - type: custom
        description: 'RustFS 端口不可达'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # ── Dependency health (/api/ready) ────────────────────────────────────────
  # See fragments/app-ready.yaml: rendered only when READY_TOKEN is set (the
  # `enabled: false` placeholder has since been moved out of the core config).
