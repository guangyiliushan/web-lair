# Gatus — 箱内监控（config-as-code 的单一真源）。
#
# 本文件永远加载；三个**无法用空值表达**的可选监控由 render-config.sh 追加为同目录片段：
#   gatus.yaml        本文件（HTTP / TCP / Bark 告警）
#   zz-domain.yaml    仅当 SITE_DOMAIN 非空（TLS 证书 + 域名到期）
#   zz-drain.yaml     仅当 DRAIN_HEARTBEAT_TOKEN 非空（drain 心跳 external endpoint）
#   zz-app-ready.yaml 仅当 READY_TOKEN 非空（/api/ready 就绪探针）
# 为什么只有这三个需要片段：空 SITE_DOMAIN 会得到 "https:///" 永久红端点；external
# endpoint 的 token 为空会被 Gatus 直接拒绝（panic）；无 READY_TOKEN 时 /api/ready
# 对所有来源 404（端点会永久红）。而 alerting.custom 的 url 为空
# 只会 Warn 并忽略 provider，所以 Bark 配置**常驻本文件**——这样"渲染门控"与
# "容器 env" 不会分歧成"片段没渲染但容器有值"的静默失联。
#
# GATUS_CONFIG_PATH 指向目录时，Gatus 会合并目录里所有 *.yaml（map 深合并、list 追加）。
# 注意它每 30s 轮询**每个文件**的 mtime：渲染必须内容幂等（cmp 后才写），否则热重载会
# 清空 memory 存储与已触发告警（状态丢失、重复告警、收不到 RESOLVED）；删除片段不会
# 触发重载，所以 render 在撤销片段时主动 touch 主文件。
#
# 目标地址全部来自环境变量（生产默认值在 compose.monitoring.yaml）。Gatus 在解析配置
# 前对整份 YAML 做 os.ExpandEnv：变量缺失会展开成空串并让 URL/token 校验失败（panic，
# exit 2），所以 MONITOR_* 必须始终有值——这也是 T3.5 校验要覆盖的错误路径。
#
# 告警：BARK_URL 未设置时 provider 被忽略（启动日志一行 "Ignoring provider=custom"），
# 端点照跑、状态照记，只是不发送（README §4）。

storage:
  # 历史不重要（箱内观察 + 告警）；memory 避免为监控再引一个卷/数据库。
  type: memory

# 注意：不要加 `skip-invalid-config-update: true`。Gatus v5.38 的热重载分支是
# stop() → load()，失败时该 flag 只 log + continue，**不会重新 start()**：容器仍是
# running，但 watchdog 与 HTTP（含 /health）都已停止 —— 静默僵尸态。不加该 flag 时
# 坏配置会 panic → exit 2 → restart: always 可见地重启（verify-config.sh 的负例覆盖）。

# Bark 告警（custom provider）：payload 只有 title/body/group，不含 URL/堆栈/凭据。
# url 为空时 Gatus 只记一行 Warn 并忽略该 provider，因此不需要片段门控。
alerting:
  custom:
    url: '${BARK_URL}'
    method: POST
    headers:
      Content-Type: application/json
    body: |
      {"title":"[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_GROUP]","body":"[ENDPOINT_NAME] — [ALERT_DESCRIPTION]","group":"web-lair"}
    client:
      timeout: 10s

# 前端标题（1024 字符内），方便和 Caddy 站名对上。
ui:
  title: web-lair status

endpoints:
  # ── 站点 HTTP：走 internal 网络直连 app:3000，不经 Caddy/DNS ──────────────
  # 直连的意义：Caddy/证书/DNS 的问题由 zz-domain.yaml 的 HTTPS 检查覆盖，
  # 这里只回答“应用进程还能不能正确响应路由”。
  - name: site-home
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 3000'
    alerts:
      - type: custom
        description: '首页不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: site-posts-zh
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/zh-cn/posts'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: custom
        description: '文章列表不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: site-sitemap
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/sitemap.xml'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: custom
        description: 'sitemap 不可用'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # 未登录访问 /admin 必须 303 到登录页（src/lib/server/authz.ts redirectToLogin）。
  # ignore-redirect 必须为 true：默认跟随重定向会看到登录页 200，反而掩盖坏掉的守卫。
  - name: site-admin-guard
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/admin'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
      ignore-redirect: true
    conditions:
      - '[STATUS] == 303'
    alerts:
      - type: custom
        description: '/admin 守卫未按 303 跳转'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # ── TCP：数据面端口存活（只证明 accept，不证明可用）──────────────────────
  - name: pg-tcp
    group: web-lair
    url: 'tcp://${MONITOR_PG_ADDR}'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[CONNECTED] == true'
    alerts:
      - type: custom
        description: 'PostgreSQL 端口不可达'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  - name: rustfs-tcp
    group: web-lair
    url: 'tcp://${MONITOR_RUSTFS_ADDR}'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    conditions:
      - '[CONNECTED] == true'
    alerts:
      - type: custom
        description: 'RustFS 端口不可达'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true

  # ── 依赖健康（/api/ready）────────────────────────────────────────────
  # 见 fragments/app-ready.yaml：该端点按 READY_TOKEN 是否配置决定是否渲染
  # （P3 的 `enabled: false` 占位在 P4 合入后已移出核心配置）。
