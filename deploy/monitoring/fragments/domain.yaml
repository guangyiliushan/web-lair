# 可选片段：公网入口的 TLS 证书与域名到期（仅当 SITE_DOMAIN 非空时渲染）。
#
# 这一层是“箱外的样子”：走真实域名 + Caddy + Let's Encrypt，和箱内直连 app:3000
# 的 HTTP 检查互补——后者在证书过期时仍然是绿的，前者在应用 500 时可能仍然绿
# （如果错误页返回 200）。两者都保留。
#
# 未设置 SITE_DOMAIN（本地/无域名阶段）：整个片段不渲染，避免 Gatus 去解析
# "https://" 这种非法 URL 而直接启动失败。
endpoints:
  - name: site-tls
    group: web-lair
    url: 'https://${SITE_DOMAIN}/'
    interval: 5m
    client:
      timeout: 10s
    conditions:
      - '[STATUS] == 200'
      # 30 天：Let's Encrypt 证书 90 天有效、Caddy 自动续期；低于 30 天说明续期
      # 已经连续失败，属于需要在过期前处理的问题。
      - '[CERTIFICATE_EXPIRATION] > 720h'
    alerts:
      - type: custom
        description: 'HTTPS 不可用或证书 30 天内过期'
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # 域名注册到期（RDAP/WHOIS；Gatus 要求 interval ≥ 5m，否则拒绝启动）。
  # 只断言到期时间，不重复断言 HTTP 状态：站点故障由 site-tls 负责。
  - name: domain-expiry
    group: web-lair
    url: 'https://${SITE_DOMAIN}/'
    interval: 12h
    client:
      timeout: 10s
    conditions:
      - '[DOMAIN_EXPIRATION] > 336h'
    alerts:
      - type: custom
        description: '域名 14 天内到期'
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true
