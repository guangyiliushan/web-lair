# Optional fragment: public-entry TLS certificate and domain expiry (rendered
# only when SITE_DOMAIN is non-empty).
#
# This layer is "what it looks like from outside the box": a real domain +
# Caddy + Let's Encrypt, complementing the in-box HTTP check that goes straight
# to app:3000 — that one stays green when the certificate expires, this one
# can stay green when the app returns 500 (if the error page answers 200).
# Keep both.
#
# Without SITE_DOMAIN (local / no-domain stage): the whole fragment is not
# rendered, so Gatus never has to parse an invalid URL like "https:///" and
# fail to start.
endpoints:
  - name: site-tls
    group: web-lair
    url: 'https://${SITE_DOMAIN}/'
    interval: 5m
    client:
      timeout: 10s
    conditions:
      - '[STATUS] == 200'
      # 30 days: Let's Encrypt certificates are valid for 90 days and Caddy
      # renews automatically; under 30 days means renewal has been failing
      # repeatedly and has to be handled before the certificate expires.
      - '[CERTIFICATE_EXPIRATION] > 720h'
    alerts:
      - type: custom
        description: 'HTTPS 不可用或证书 30 天内过期'
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true

  # Domain registration expiry (RDAP/WHOIS; Gatus requires interval ≥ 5m or it
  # refuses to start). Only the expiry time is asserted, not the HTTP status:
  # site outages are site-tls' job.
  - name: domain-expiry
    group: web-lair
    url: 'https://${SITE_DOMAIN}/'
    interval: 12h
    client:
      timeout: 10s
    conditions:
      - '[DOMAIN_EXPIRATION] > 336h'
    alerts:
      - type: custom
        description: '域名 14 天内到期'
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true
