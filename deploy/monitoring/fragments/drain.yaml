# Optional fragment: drain heartbeat deadman, rendered only when
# DRAIN_HEARTBEAT_TOKEN is non-empty. The push contract, the
# do-not-enable-yet warning and the window rationale live in
# deploy/monitoring/README.md "8. drain 心跳（接线未完成）".
#
# Address by scenario: inside the app container (drain runs via
# `compose run --rm app`) use http://gatus:8080; a host curl (systemd
# fallback) uses http://127.0.0.1:8080 — 127.0.0.1 inside a container points
# at the container itself and would fail forever.
#
# The 30m interval must cover the longest tick: the drain unit has
# TimeoutStartSec=960 and the job itself timeoutMs=900000 (15m); 5m would
# false-alarm on a healthy slow tick.
external-endpoints:
  - name: jobs-drain
    group: web-lair
    token: '${DRAIN_HEARTBEAT_TOKEN}'
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: 'drain 心跳停止（定时任务未运行或持续失败）'
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true
