# Optional fragment: drain heartbeat deadman (rendered only when
# DRAIN_HEARTBEAT_TOKEN is non-empty).
#
# Semantics: after every successful round the drain timer pushes "I am still
# running" to Gatus:
#   POST http://<gatus>/api/v1/endpoints/web-lair_jobs-drain/external?success=true
#   Authorization: Bearer ${DRAIN_HEARTBEAT_TOKEN}
# Address by scenario:
#   - inside the app container (drain runs via `compose run --rm app`)
#     → http://gatus:8080
#   - host curl (systemd fallback) → http://127.0.0.1:8080
# 127.0.0.1 inside a container points at the container itself and would fail
# forever.
#
# The interval must cover the longest tick: the drain unit has
# TimeoutStartSec=960 and the job itself timeoutMs=900000 (15m); 5m would
# false-alarm on a healthy slow tick, so 30m.
#
# The drain in this repo (jobs/drain.ts) still sends a plain GET to
# JOBS_HEARTBEAT_URL (Kuma push shape); the cutover is described in README §8:
# do not set DRAIN_HEARTBEAT_TOKEN before that wiring, or this endpoint stays
# permanently red.
external-endpoints:
  - name: jobs-drain
    group: web-lair
    token: '${DRAIN_HEARTBEAT_TOKEN}'
    heartbeat:
      interval: 30m
    alerts:
      - type: custom
        description: 'drain 心跳停止（定时任务未运行或持续失败）'
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true
