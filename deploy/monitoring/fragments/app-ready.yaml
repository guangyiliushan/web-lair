# Optional fragment: dependency health /api/ready (rendered only when
# READY_TOKEN is non-empty).
#
# Why a fragment and not core config: /api/ready did not exist yet when the
# Gatus work landed, so the core gatus.yaml could only carry that endpoint as
# `enabled: false`. Once the route existed it only answers callers that carry
# READY_TOKEN (in production, no token → 404 for everyone; Gatus is not on
# loopback inside the compose private network). Enabling it in the core config
# would leave token-less deployments permanently red — the same reason as the
# domain fragment: an endpoint that cannot be expressed safely as an empty
# value is expressed by whether it gets rendered at all.
#
# Semantics: /api/ready only proves DB `select 1` + Valkey PING (2s timeout,
# 10s cache); it complements /api/health (liveness, no dependency checks).
#
# Acceptance:
#   - READY_TOKEN set → zz-app-ready.yaml is rendered and the Gatus log shows
#     `endpoint=app-ready;`
#   - READY_TOKEN empty → the fragment is not rendered and the core config
#     carries no such endpoint (verify-config.sh asserts both directions)
endpoints:
  - name: app-ready
    group: web-lair
    url: 'http://${MONITOR_APP_ADDR}/api/ready'
    interval: ${MONITOR_INTERVAL}
    client:
      timeout: 5s
    # Endpoint-level `headers` (not client-level: Gatus' client.Config has no
    # Headers field, so anything under `client` is silently dropped).
    headers:
      Authorization: 'Bearer ${READY_TOKEN}'
    conditions:
      - '[STATUS] == 200'
      - '[BODY].status == ready'
    alerts:
      - type: custom
        description: '应用依赖（DB/Valkey）不 ready'
        failure-threshold: ${MONITOR_FAILURE_THRESHOLD}
        success-threshold: ${MONITOR_SUCCESS_THRESHOLD}
        send-on-resolved: true
