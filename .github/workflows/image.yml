name: image

# Build the deployment image and prove it before merge: three real executions in
# order — `deploy/verify-image.sh`, `deploy/image-size-check.sh` (absolute target
# + 10% regression budget against `deploy/image-size-baseline.json`), and the
# build itself (catches lockfile/pnpm-version drift).
# Path-filtered on image inputs, so a documentation-only PR skips the eight-minute
# build.
# Advisory, not required: a path-filtered workflow's skipped check would stay
# "Pending" forever and block PRs that never touch these paths (GitHub docs,
# "Handling skipped but required checks"). Required checks are `ci / verify` and
# `auth-schema / guard` only.

on:
  push:
    branches: [main, dev, 'dev/**']
  pull_request:
    paths:
      # Everything that can change the image bytes. `messages/**` and
      # `project.inlang/**` are image inputs too: the Paraglide runtime is
      # compiled into `build/`.
      - Dockerfile
      - .dockerignore
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.ts
      - svelte.config.js
      - tsconfig.json
      - tsconfig.*.json
      - messages/**
      - project.inlang/api/**
      - project.inlang/settings.json
      - static/**
      - deploy/**
      - drizzle/**
      - jobs/**
      - scripts/**
      - src/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Cold build ~8 min on the deployment host; a runner with a warm GHA layer
    # cache is faster, a cold cache slower. The cap is for a hung install.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `deploy/image-size-check.sh` parses the baseline with `node -e`; pin the
      # runtime instead of trusting whatever the runner image ships.
      # cache-poisoning suppressed with evidence: setup-node v4.4.0 has no
      # package-manager-cache input and caches nothing unless `cache:` is set
      # (action.yml verified); the job only runs `node -e`, and the
      # image build happens in Docker where the host store is never read.
      # Re-audit on the v7 upgrade.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: web-lair-app:ci
          # Layer cache across runs: the pnpm install layers are the expensive
          # part and only invalidate when the lockfile changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verify image (three gates)
        run: bash deploy/verify-image.sh web-lair-app:ci

      - name: size gate
        run: bash deploy/image-size-check.sh web-lair-app:ci
