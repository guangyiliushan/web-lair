name: ci

# The merge gate runs as one job so every gate sees the same generated Paraglide
# artifact. `build` precedes `check` because `src/lib/paraglide` is generated and
# gitignored, and only the Vite plugin can express urlPatterns and the
# per-surface routeStrategies: a CLI-compiled tree is a different runtime, so
# type-checking it would validate code that never ships (Paraglide docs,
# "Compiling Messages").
# One job also shares one warm `node_modules` across the heavy steps and keeps
# the required status check a single name (`ci / verify`); splitting later means
# adding the new name to the required list at the same time. Split trigger:
# P95 verify wall time > 12 min across the first 5 green runs.
# Not here: e2e (own workflow, nightly + push) and
# `dev auth-check` (owned by `.github/workflows/auth-schema.yml`).
# Governance scans (comment style, doc refs, link hygiene) were removed from the
# PR path: they guard repo hygiene, not the SvelteKit architecture, and do not
# catch product defects.

on:
  push:
    branches: [main, dev, 'dev/**']
  pull_request:
  workflow_dispatch:

# Same ref → the newest run wins. Keyed on PR number (stable identity across
# force-push re-runs) or the commit SHA for branch pushes; `github.workflow`
# keeps buckets per workflow. `github.ref` was replaced deliberately: PR merge
# refs change identity semantics and workflow renames shift buckets (GitHub
# docs, workflow syntax — concurrency groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time placeholders, mirroring the Dockerfile's build stage: SvelteKit's
  # route analysis imports server modules whose import-time guards need them.
  # They are NOT credentials and grant access to nothing (no secret is
  # referenced anywhere in this workflow). The URL carries no user/password on
  # purpose: postgres.js is lazy, so nothing ever dials this address.
  DATABASE_URL: postgres://localhost:5432/build
  ORIGIN: http://localhost:3000
  BETTER_AUTH_SECRET: build-time-placeholder-secret-000000

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Cold install + check (~3m) + lint (~1m) + both unit projects (~8m) +
    # build (~3m) fits comfortably; the cap exists so a hung browser test
    # cannot burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout needs the workflow token as a git credential;
          # keeping it out of `.git/config` shrinks the blast radius of any
          # compromised install/build script.
          persist-credentials: false

      # `version` is omitted on purpose: the action reads `packageManager` from
      # package.json (single source of truth), so Docker and CI cannot drift
      # again (pnpm/action-setup README).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Entry contract: manifest ↔ files ↔ deploy hooks ↔ docs ↔ package.json.
      # Cheap and independent of the build, so it fails before the heavy gates.
      # Also proves every runtime=node entry's import closure is node-pure:
      # the runtime image has no tsx, so a `$lib` import here would only fail
      # at deploy time otherwise.
      - name: entry contract
        run: node scripts/check-entries.ts

      # Generates `src/lib/paraglide` with the Vite plugin's real options. Every
      # later gate (check, vitest, and the production build already on disk)
      # then reads one consistent artifact.
      - name: build (also generates the Paraglide runtime)
        run: pnpm build

      - name: check
        run: pnpm check

      - name: lint
        run: pnpm lint

      - name: unit (server)
        run: pnpm exec vitest run --project server

      # The client project runs in a real Chromium via @vitest/browser-playwright;
      # `--with-deps` installs the shared libraries the runner image lacks.
      - name: browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: unit (client)
        run: pnpm exec vitest run --project client
