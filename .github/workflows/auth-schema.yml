name: auth-schema

on:
  push:
    branches: [main, dev, dev/v0.0.1]
  pull_request:

permissions:
  contents: read

# Newest run wins; capped concurrency keeps a flapping PR from burning the
# compute budget (GitHub docs, workflow syntax — concurrency groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Version omitted on purpose: reads `packageManager` from package.json
      # (single source of truth, same policy as ci.yml).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No network and no auth CLI: catches a hand-written ALTER/DROP/index on
      # a generated table and the H3 customizations.
      - run: pnpm ops dev auth-check --migrations-only
      # Regenerates the schema into a temp file and diffs the committed one.
      - run: pnpm ops dev auth-check
